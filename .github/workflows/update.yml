# Daily update of the race database.
# Runs every night at 04:23 UTC (and on demand: Actions tab > "Update races" > "Run workflow").
name: Update races

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-races
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect races and update the database
        run: python tools/update_races.py

      - name: Save the new data
        run: |
          git config user.name  "race-updater"
          git config user.email "race-updater@users.noreply.github.com"
          git add data/races.json data/races.js data/geocache.json data/update_report.json
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "Race data update $(date -u +%F)"
            git push
          fi

      - name: Report problems (sends you an e-mail if a site could not be read)
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("data/update_report.json", encoding="utf-8"))
          for line in report.get("errors", []):
              print("::warning::" + line)
          sys.exit(1 if report.get("errors") else 0)
          PY
